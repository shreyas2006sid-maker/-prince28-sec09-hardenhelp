
# CD: deploy successful main builds to Render and verify production.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (for rollback)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and smoke test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked

      - name: Run production database migrations
        if: github.event_name == 'workflow_run'
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGE}:sha-${SHA}" \
            "$RENDER_DEPLOY_HOOK"

      - name: Verify production deployment
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          test -n "$LIVE_URL"

          uv run python scripts/smoke.py \
            "$LIVE_URL" \
            --expect-version "$SHA" \
            --timeout 600 \
            --interval 10
