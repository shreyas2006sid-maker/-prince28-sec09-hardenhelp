[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardenhelp"
version = "0.1.0"
description = "Local-first, reference-only XCCDF benchmark rule explorer"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
